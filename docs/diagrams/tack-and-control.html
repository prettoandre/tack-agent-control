<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tack and tack-agent-control · Layer stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0A0B0D;
      --color-paper-2: #111317;
      --color-ink:     #E8EAED;
      --color-muted:   #9BA1AB;
      --color-soft:    #8B919B;
      --color-rule:    rgba(232,234,237,0.10);
      --color-accent:  #8B8CFF;
      --color-link:    #5AA9FF;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1360px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.5rem; }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; max-width: 72ch; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · tack + tack-agent-control</p>
    <h1>How tack and tack-agent-control fit together</h1>
    <p class="subtitle">tack says what the work is and how a wave is run; tack-agent-control decides where and when it runs and watches it. They meet only at a small, versioned contract.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tack-and-control-title tack-and-control-desc">
        <title id="tack-and-control-title">How tack and tack-agent-control fit together</title>
        <desc id="tack-and-control-desc">Layer stack from projects that adopt tack, through tack's contract, skills and driver, the versioned contract between the two projects, tack-agent-control's dispatch, fleet, scheduler, telemetry and UI, down to the devboxes, herdr and the Claude Code and Codex agents.</desc>

        <rect width="100%" height="100%" fill="#0A0B0D"/>

        <!-- Direction column -->
        <text x="40" y="72" fill="#9BA1AB" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DEFINES WORK</text>
        <line x1="56" y1="84" x2="56" y2="516" stroke="rgba(232,234,237,0.30)" stroke-width="1"/>
        <polygon points="52,516 60,516 56,524" fill="#9BA1AB"/>
        <text x="40" y="544" fill="#9BA1AB" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">RUNS WORK</text>
        <g fill="#8B919B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="end">
          <text x="148" y="163">ADOPT</text>
          <text x="148" y="259">PUBLISHES</text>
          <text x="148" y="355">READS · RUNS</text>
          <text x="148" y="451">DISPATCHES</text>
        </g>

        <!-- Stack edges -->
        <line x1="160" y1="80" x2="1200" y2="80" stroke="rgba(232,234,237,0.12)" stroke-width="1"/>
        <line x1="160" y1="528" x2="1200" y2="528" stroke="rgba(232,234,237,0.12)" stroke-width="1"/>

        <!-- 01 Projects -->
        <rect x="160" y="80" width="1040" height="80" fill="#0A0B0D"/>
        <line x1="160" y1="160" x2="1200" y2="160" stroke="rgba(232,234,237,0.12)" stroke-width="1"/>
        <text x="176" y="124" fill="#9BA1AB" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01</text>
        <text x="240" y="118" fill="#E8EAED" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Projects</text>
        <text x="240" y="136" fill="#9BA1AB" font-size="9" font-family="'Geist Mono', monospace">own their specs and gate command; adopt tack</text>
        <g font-family="'Geist', sans-serif" font-size="12" fill="#E8EAED">
          <rect x="904" y="108" width="120" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="912" y="124">sigamobilidade</text>
          <rect x="1032" y="108" width="56" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="1040" y="124">scaii</text>
          <rect x="1096" y="108" width="88" height="24" rx="4" fill="none" stroke="#9BA1AB" stroke-width="0.8" stroke-dasharray="3,2"/>
          <text x="1104" y="124" fill="#9BA1AB">more later</text>
        </g>

        <!-- 02 tack -->
        <rect x="160" y="160" width="1040" height="96" fill="#111317"/>
        <line x1="160" y1="256" x2="1200" y2="256" stroke="rgba(232,234,237,0.12)" stroke-width="1"/>
        <text x="176" y="212" fill="#9BA1AB" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02</text>
        <text x="240" y="206" fill="#E8EAED" font-size="14" font-weight="600" font-family="'Geist', sans-serif">tack</text>
        <text x="240" y="224" fill="#9BA1AB" font-size="9" font-family="'Geist Mono', monospace">specs/NNN-slug/ spec · plan · tasks · events.jsonl</text>
        <g font-family="'Geist', sans-serif" font-size="12" fill="#E8EAED">
          <rect x="712" y="196" width="160" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="720" y="212">contract + validator</text>
          <rect x="880" y="196" width="120" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="888" y="212">skills, pinned</text>
          <rect x="1008" y="196" width="176" height="24" rx="4" fill="none" stroke="#9BA1AB" stroke-width="0.8" stroke-dasharray="3,2"/>
          <text x="1016" y="212">driver · tack wave run</text>
        </g>

        <!-- 03 The contract (focal) -->
        <rect x="160" y="256" width="1040" height="96" fill="rgba(139,140,255,0.12)"/>
        <rect x="160" y="256" width="1040" height="96" fill="none" stroke="#8B8CFF" stroke-width="1"/>
        <text x="176" y="308" fill="#8B8CFF" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">03</text>
        <text x="240" y="302" fill="#E8EAED" font-size="14" font-weight="600" font-family="'Geist', sans-serif">The contract</text>
        <text x="240" y="320" fill="#8B8CFF" font-size="9" font-family="'Geist Mono', monospace">versioned; control rejects an unknown schema</text>
        <g font-family="'Geist Mono', monospace" font-size="9" fill="#E8EAED">
          <rect x="592" y="276" width="96" height="24" rx="4" fill="#0A0B0D" stroke="#8B8CFF" stroke-width="0.8"/>
          <text x="600" y="292">tack.status/v1</text>
          <rect x="696" y="276" width="84" height="24" rx="4" fill="#0A0B0D" stroke="#8B8CFF" stroke-width="0.8"/>
          <text x="704" y="292">tack.next/v1</text>
          <rect x="788" y="276" width="108" height="24" rx="4" fill="#0A0B0D" stroke="#8B8CFF" stroke-width="0.8"/>
          <text x="796" y="292">spec/NNN-slug-wN</text>
          <rect x="904" y="276" width="96" height="24" rx="4" fill="#0A0B0D" stroke="#8B8CFF" stroke-width="0.8"/>
          <text x="912" y="292">exit 0 · 1 · 2</text>
          <rect x="1008" y="276" width="176" height="24" rx="4" fill="#0A0B0D" stroke="#8B8CFF" stroke-width="0.8"/>
          <text x="1016" y="292">OTEL_RESOURCE_ATTRIBUTES</text>
        </g>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#9BA1AB">
          <text x="592" y="318">DAG, state, tokens</text>
          <text x="696" y="318">what can run</text>
          <text x="788" y="318">one PR per wave</text>
          <text x="904" y="318">1: errors in doc</text>
          <text x="904" y="332">2: blocked, no run</text>
          <text x="1008" y="318">tack.spec, wave, task, run</text>
          <text x="1008" y="332">+ host, engine</text>
        </g>

        <!-- 04 tack-agent-control -->
        <rect x="160" y="352" width="1040" height="96" fill="#111317"/>
        <line x1="160" y1="352" x2="1200" y2="352" stroke="rgba(232,234,237,0.12)" stroke-width="1"/>
        <line x1="160" y1="448" x2="1200" y2="448" stroke="rgba(232,234,237,0.12)" stroke-width="1"/>
        <text x="176" y="404" fill="#9BA1AB" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">04</text>
        <text x="240" y="398" fill="#E8EAED" font-size="14" font-weight="600" font-family="'Geist', sans-serif">tack-agent-control</text>
        <text x="240" y="416" fill="#9BA1AB" font-size="9" font-family="'Geist Mono', monospace">where and when; its DB is an index rebuilt from tack's log</text>
        <g font-family="'Geist', sans-serif" font-size="12" fill="#E8EAED">
          <rect x="824" y="388" width="76" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="832" y="404">dispatch</text>
          <rect x="908" y="388" width="52" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="916" y="404">fleet</text>
          <rect x="968" y="388" width="84" height="24" rx="4" fill="none" stroke="#9BA1AB" stroke-width="0.8" stroke-dasharray="3,2"/>
          <text x="976" y="404">scheduler</text>
          <rect x="1060" y="388" width="84" height="24" rx="4" fill="none" stroke="#9BA1AB" stroke-width="0.8" stroke-dasharray="3,2"/>
          <text x="1068" y="404">telemetry</text>
          <rect x="1152" y="388" width="32" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="1160" y="404">UI</text>
        </g>

        <!-- 05 Devboxes and agents -->
        <rect x="160" y="448" width="1040" height="80" fill="#0A0B0D"/>
        <text x="176" y="492" fill="#9BA1AB" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">05</text>
        <text x="240" y="486" fill="#E8EAED" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Devboxes and agents</text>
        <text x="240" y="504" fill="#9BA1AB" font-size="9" font-family="'Geist Mono', monospace">hold the repos and containers; one worktree per run</text>
        <g font-family="'Geist', sans-serif" font-size="12" fill="#E8EAED">
          <rect x="736" y="476" width="120" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="744" y="492">devbox-homelab</text>
          <rect x="864" y="476" width="88" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="872" y="492">devbox-htz</text>
          <rect x="960" y="476" width="96" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="968" y="492">herdr 0.9.3</text>
          <rect x="1064" y="476" width="60" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="1072" y="492">claude</text>
          <rect x="1132" y="476" width="52" height="24" rx="4" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="1140" y="492">codex</text>
        </g>

        <!-- Callouts -->
        <g font-family="'Instrument Serif', serif" font-size="14" font-style="italic">
          <text x="160" y="580" fill="#E8EAED">Not a single hub orchestrator: every project carries its own pinned tack, and tack never calls control.</text>
          <text x="160" y="600" fill="#E8EAED">Control only reads tack's documents and starts tack's CLI on the devbox, so each side can change behind the contract.</text>
          <text x="160" y="628" fill="#9BA1AB">Today control still runs a plain plan, names branches run/&lt;id&gt;-&lt;slug&gt; and reads plan checkboxes; the switch to tack is sub-project 3 of tack's SDD spec.</text>
        </g>

        <!-- Legend strip -->
        <line x1="40" y1="660" x2="1240" y2="660" stroke="rgba(232,234,237,0.10)" stroke-width="0.8"/>
        <text x="40" y="676" fill="#9BA1AB" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <g font-family="'Geist', sans-serif" font-size="8.5" fill="#9BA1AB">
          <rect x="40" y="690" width="14" height="10" rx="2" fill="rgba(139,140,255,0.12)" stroke="#8B8CFF" stroke-width="1"/>
          <text x="60" y="698">Focal: the contract between the two projects</text>
          <rect x="300" y="690" width="14" height="10" rx="2" fill="rgba(232,234,237,0.05)" stroke="#9BA1AB" stroke-width="0.8"/>
          <text x="320" y="698">Exists today</text>
          <rect x="420" y="690" width="14" height="10" rx="2" fill="none" stroke="#9BA1AB" stroke-width="0.8" stroke-dasharray="3,2"/>
          <text x="440" y="698">Specified, not built yet</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
