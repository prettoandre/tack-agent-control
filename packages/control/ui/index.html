<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tac</title>
  <link rel="stylesheet" href="/xterm.css" />
  <style>
    :root {
      --canvas: #010102; --surface-1: #0f1011; --surface-2: #141516; --surface-3: #18191a; --surface-4: #191a1b;
      --hairline: #23252a; --hairline-strong: #34343a;
      --ink: #f7f8f8; --ink-muted: #d0d6e0; --ink-subtle: #8a8f98;
      --primary: #5e6ad2; --primary-hover: #828fff; --primary-focus: #5e69d1; --on-primary: #ffffff;
      --font: "Inter", "SF Pro Display", -apple-system, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 14px/1.5 var(--font); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    h2, h3 { font-weight: 600; letter-spacing: -0.4px; margin: 16px 0 8px; }
    h2 { font-size: 22px; }
    h3 { font-size: 16px; font-weight: 500; }
    strong { font-weight: 500; }
    a { color: var(--primary-hover); }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid rgb(94 105 209 / 0.5); outline-offset: 2px; }
    .mono { font-family: var(--mono); font-size: 13px; }
    .row { display: flex; gap: 8px 12px; align-items: center; padding: 16px 0; min-height: 44px; background: var(--canvas); border-bottom: 1px solid var(--hairline); cursor: pointer; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); color: var(--ink-muted); border-radius: 9999px; padding: 2px 8px; font-size: 12px; line-height: 1.4; }
    .badge .dot { width: 6px; height: 6px; border-radius: 9999px; }
    .muted { color: var(--ink-subtle); font-size: 13px; overflow-wrap: anywhere; min-width: 0; }
    .row > * { overflow-wrap: anywhere; min-width: 0; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
    button { font: 500 14px/1.2 var(--font); min-height: 44px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface-1); color: var(--ink); cursor: pointer; }
    button:hover { background: var(--surface-3); }
    button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    button.primary:active { background: var(--primary-focus); }
    input { font: 400 16px/1.5 var(--font); min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface-1); color: var(--ink); flex: 1; min-width: 0; }
    input::placeholder { color: var(--ink-subtle); }
    input:focus { border-color: var(--hairline-strong); }
    .err { background: var(--surface-2); border: 1px solid rgb(220 38 38 / 0.4); color: #f1a7a7; padding: 8px 12px; border-radius: 8px; }
    .card { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 16px; padding: 12px; }
    #term { width: 100%; height: 60vh; overflow: auto; }
    @media (max-width: 767px) {
      main { padding: 16px; }
      .bar > button { flex: 1 1 auto; }
      .bar > input { flex-basis: 100%; }
    }
  </style>
</head>
<body><main id="root"></main><script type="module" src="/main.js"></script></body>
</html>
